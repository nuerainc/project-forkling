name: forkling

# The agent forklings itself on every push.
# Three gates: a `run` smoke test, the full pytest suite, then a real
# self-improve attempt gated by tests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # required for the self-improve step to push back

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install (stdlib-only)
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Run tests
        run: python -m pytest -q

  run-smoke:
    name: forkling run (smoke)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e .
      - name: Doctor
        run: python -m forkling doctor
      - name: Plan a one-shot task
        run: python -m forkling plan "list forkling"
      - name: Verify the capability ledger is intact
        run: python -m forkling verify

  forkling:
    name: forkling self-improve
    needs: [test, run-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: forkling self-improve
        env:
          DOGFOOD_REPO: ${{ github.workspace }}
          # No Ollama in CI by default; rule-based fallback still runs the
          # full ship/rollback loop. Set DOGFOOD_OLLAMA_URL to enable.
          DOGFOOD_OLLAMA_URL: "http://127.0.0.1:1"
        run: python scripts/self_improve.py
      - name: Push the forkling commit (if any)
        # Only when running on main itself. On a pull_request event HEAD is
        # the PR's merge commit, so pushing it would merge the PR into main
        # without review.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: git push origin HEAD:main
        # The script only commits when tests pass; if it didn't commit, this
        # is a no-op push.
